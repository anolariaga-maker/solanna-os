<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolannaOS</title>

    <script>
        // Anti-parpadeo: aplica el tema guardado ANTES de que se pinte la página,
        // así no se ve un flash de modo claro al entrar con el modo oscuro elegido.
        (function () {
            try {
                var guardado = localStorage.getItem("solannaos-theme");
                if (guardado === "dark" || guardado === "light") {
                    document.documentElement.setAttribute("data-theme", guardado);
                }
            } catch (e) { /* localStorage no disponible: seguimos en modo claro */ }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <script>
        window.googleIdentityStatus = "cargando";

        function onGoogleIdentityLoaded() {
            window.googleIdentityStatus = "listo";
            if (typeof onGoogleIdentityReady === "function") onGoogleIdentityReady();
        }

        function onGoogleIdentityError() {
            window.googleIdentityStatus = "error";
            if (typeof onGoogleIdentityFailed === "function") onGoogleIdentityFailed();
        }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer
            onload="onGoogleIdentityLoaded()" onerror="onGoogleIdentityError()"></script>
</head>
<body>

    <!-- ============================================================ -->
    <!-- PANTALLA DE LOGIN                                              -->
    <!-- ============================================================ -->
    <div id="loginScreen">
        <div class="login-card">
            <div class="login-seal">S</div>
            <div class="login-mark">Solanna<span>OS</span></div>
            <p class="login-sub">Iniciá sesión con tu cuenta de Google para entrar.</p>
            <div id="botonGoogleLogin"></div>
            <p id="errorLogin"></p>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- APLICACIÓN                                                     -->
    <!-- ============================================================ -->
    <div id="appScreen" style="display:none;">

        <div class="sidebar-overlay" id="sidebarOverlay" onclick="cerrarMenuMovil()"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-seal">S</div>
                <div class="sidebar-brand-text">Solanna<span>OS</span></div>
            </div>
            <nav>
                <button class="nav-item" data-modulo="inicio" onclick="irAModulo('inicio')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg>
                    Inicio
                </button>
                <button class="nav-item" data-modulo="ventas" onclick="irAModulo('ventas')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
                    Ventas
                </button>
                <button class="nav-item" data-modulo="compras" onclick="irAModulo('compras')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16l-1.5 11a1 1 0 0 1-1 1H6.5a1 1 0 0 1-1-1L4 8Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
                    Compras
                </button>
                <button class="nav-item" data-modulo="clientes" onclick="irAModulo('clientes')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1-3.5 4-5.5 7-5.5s6 2 7 5.5"/></svg>
                    Clientes
                </button>
                <button class="nav-item" data-modulo="productos" onclick="irAModulo('productos')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 12.5 12.7 4.7a2 2 0 0 0-1.4-.6H5a1 1 0 0 0-1 1v6.3c0 .5.2 1 .6 1.4l7.8 7.8a2 2 0 0 0 2.8 0l5.3-5.3a2 2 0 0 0 0-2.8Z"/><circle cx="8.3" cy="8.3" r="1.3"/></svg>
                    Productos
                </button>
                <button class="nav-item" data-modulo="reservas" onclick="irAModulo('reservas')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>
                    Reservas
                </button>
                <button class="nav-item" data-modulo="radar" onclick="irAModulo('radar')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>
                    Radar
                </button>
                <button class="nav-item" data-modulo="caja" onclick="irAModulo('caja')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14" r="1.4"/></svg>
                    Caja
                </button>
                <button class="nav-item" data-modulo="admin" onclick="irAModulo('admin')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l1.9-1.5-2-3.4-2.2.9a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.5 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.2-.9-2 3.4L4.6 10.5a7.7 7.7 0 0 0 0 3l-1.9 1.5 2 3.4 2.2-.9c.77.66 1.65 1.17 2.6 1.5l.5 2.5h4l.5-2.5a7.6 7.6 0 0 0 2.6-1.5l2.2.9 2-3.4-1.9-1.5Z"/></svg>
                    Administración
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="theme-toggle" id="botonTema" onclick="alternarTema()">
                    <span id="etiquetaTema">Modo oscuro</span>
                    <svg id="iconoTema" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
                </button>
                <button class="nav-item" onclick="cerrarSesion()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 17.5 20 12l-5-5.5M20 12H9"/><path d="M9 20H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h4"/></svg>
                    Salir
                </button>
            </div>
        </aside>

        <div class="main-area">
            <div class="topbar">
                <span class="topbar-brand"><span style="font-family:var(--font-display);">S</span>olanna<span>OS</span></span>
                <button class="topbar-toggle" onclick="abrirMenuMovil()" aria-label="Abrir menú">☰</button>
            </div>
            <main id="contenido"></main>
        </div>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
