<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolannaOS</title>
    <link rel="stylesheet" href="css/style.css">

    <script>
        // Estado global de la librería de Google Identity. app.js lo consulta
        // apenas termina de cargar, por si el aviso de abajo ya pasó antes.
        window.googleIdentityStatus = "cargando"; // "cargando" | "listo" | "error"

        // Estas dos funciones quedan definidas ACÁ, antes de siquiera pedir
        // el script de Google, así no hay ninguna carrera posible: no importa
        // si el script de Google carga en 10ms o en 3 segundos, cuando dispare
        // onload/onerror estas funciones YA existen.
        function onGoogleIdentityLoaded() {
            window.googleIdentityStatus = "listo";
            if (typeof onGoogleIdentityReady === "function") {
                onGoogleIdentityReady();
            }
        }

        function onGoogleIdentityError() {
            window.googleIdentityStatus = "error";
            if (typeof onGoogleIdentityFailed === "function") {
                onGoogleIdentityFailed();
            }
        }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer
            onload="onGoogleIdentityLoaded()" onerror="onGoogleIdentityError()"></script>
</head>
<body>

    <!-- ============================================================ -->
    <!-- PANTALLA DE LOGIN — se muestra hasta iniciar sesión con Google -->
    <!-- ============================================================ -->
    <div id="loginScreen">
        <h1>SolannaOS</h1>
        <p>Iniciá sesión con la cuenta de Google autorizada para continuar.</p>
        <div id="botonGoogleLogin"></div>
        <p id="errorLogin" style="color:red;"></p>
    </div>

    <!-- ============================================================ -->
    <!-- APLICACIÓN — oculta hasta que el login sea exitoso             -->
    <!-- ============================================================ -->
    <div id="appScreen" style="display:none;">

        <header>
            <h1>SolannaOS</h1>
            <nav>
                <button onclick="mostrarModulo('inicio')">Inicio</button>
                <button onclick="mostrarModulo('ventas')">Ventas</button>
                <button onclick="mostrarModulo('compras')">Compras</button>
                <button onclick="mostrarModulo('clientes')">Clientes</button>
                <button onclick="mostrarModulo('productos')">Productos</button>
                <button onclick="mostrarModulo('reservas')">Reservas</button>
                <button onclick="mostrarModulo('radar')">Radar</button>
                <button onclick="mostrarModulo('caja')">Caja</button>
                <button onclick="mostrarModulo('admin')">Administración</button>
                <button onclick="cerrarSesion()">Salir</button>
            </nav>
        </header>

        <main id="contenido">
            <!-- mostrarModulo() de app.js escribe acá adentro -->
        </main>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
